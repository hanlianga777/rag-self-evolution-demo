<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>RAG 自进化业务流程图</title><style>body{margin:0;background:#f7f5f0;color:#2d3142;font-family:Arial,"Microsoft YaHei",sans-serif}svg{display:block;width:100%;height:auto}.zone{fill:#fffdf9;stroke:#c9c7c0;stroke-width:1.2}.focal{fill:#fff0e8;stroke:#eb6c36;stroke-width:2}.t{font-size:18px;font-weight:700}.s{font-size:12px;fill:#4f5d75}.l{font-size:11px;fill:#6f7582}.a{stroke:#4f5d75;stroke-width:2;fill:none;marker-end:url(#flow-arrow)}.d{stroke-dasharray:7 5}.cap{font-size:13px;letter-spacing:2px;fill:#eb6c36;font-weight:700}</style></head><body><svg viewBox="0 0 1280 720" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">RAG 自进化业务流程图</title><desc id="flow-desc">从知识库治理、评测和 Bad Case，经过受限优化、Sandbox、人工发布，到 Monitoring 人工确认反馈的产品生命周期。</desc><defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f7f5f0"/><text x="52" y="52" class="t">RAG 自进化业务流程</text><text x="52" y="77" class="s">自动节点、Agent 节点与人工治理节点共同构成可审计闭环</text><g transform="translate(52 120)"><text class="cap" x="0" y="-18">KNOWLEDGE & GOVERNANCE</text><rect class="zone" width="220" height="112" rx="14"/><text class="t" x="18" y="34">知识库 → Golden</text><text class="s" x="18" y="60">Probe ≥90 · QC ≥85</text><text class="s" x="18" y="82">Human Review → Snapshot</text></g><g transform="translate(330 120)"><text class="cap" x="0" y="-18">EVALUATION</text><rect class="zone" width="180" height="112" rx="14"/><text class="t" x="18" y="34">Baseline</text><text class="s" x="18" y="60">三组评测 · 证据</text><text class="s" x="18" y="82">Bad Case 追溯</text></g><g transform="translate(570 120)"><text class="cap" x="0" y="-18">DIAGNOSIS</text><rect class="focal" width="180" height="112" rx="14"/><text class="t" x="18" y="34">Root Cause</text><text class="s" x="18" y="60">Cluster · Hypothesis</text><text class="s" x="18" y="82">Optimization Agent</text></g><g transform="translate(810 120)"><text class="cap" x="0" y="-18">SANDBOX</text><rect class="zone" width="180" height="112" rx="14"/><text class="t" x="18" y="34">A / B / C / D</text><text class="s" x="18" y="60">受限 Search Space</text><text class="s" x="18" y="82">max_evals = 12</text></g><g transform="translate(1050 120)"><text class="cap" x="0" y="-18">QUALITY</text><rect class="zone" width="180" height="112" rx="14"/><text class="t" x="18" y="34">Gate + Regression</text><text class="s" x="18" y="60">11 / 11 PASS</text><text class="s" x="18" y="82">有效提升才 Qualified</text></g><path class="a" d="M272 176H330"/><path class="a" d="M510 176H570"/><path class="a" d="M750 176H810"/><path class="a" d="M990 176H1050"/><g transform="translate(200 360)"><text class="cap" x="0" y="-18">HUMAN RELEASE</text><rect class="focal" width="250" height="118" rx="14"/><text class="t" x="18" y="36">Recommendation</text><text class="s" x="18" y="62">Human Release 不可绕过质量验证</text><text class="s" x="18" y="86">Version Snapshot · Audit Trail</text></g><g transform="translate(520 360)"><text class="cap" x="0" y="-18">PRODUCTION</text><rect class="zone" width="220" height="118" rx="14"/><text class="t" x="18" y="36">Production Version</text><text class="s" x="18" y="62">问答 · Citation · Version Management</text><text class="s" x="18" y="86">Rollback 至上一已发布版本</text></g><g transform="translate(810 360)"><text class="cap" x="0" y="-18">MONITORING</text><rect class="zone" width="290" height="118" rx="14"/><text class="t" x="18" y="36">Monitoring → Trigger</text><text class="s" x="18" y="62">1 Safety Critical 或 20 次中 ≥4 Bad Case</text><text class="s" x="18" y="86">Pending → Human Confirm → Agent</text></g><path class="a" d="M1140 232V320H325V360"/><path class="a" d="M450 419H520"/><path class="a" d="M740 419H810"/><path class="a d" d="M955 478V580H660V232"/><text class="l" x="680" y="570">经 Human Confirm 的 Monitoring Trigger 回到 Optimization Agent</text><rect x="52"
