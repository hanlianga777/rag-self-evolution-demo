name: Rule consistency

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rule-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend rules and request payloads
        working-directory: backend
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RAG_FORCE_MOCK: '1'
          RAG_SAFE_START: '1'
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pytest -q -p no:cacheprovider tests/test_rules_sync.py
          python scripts/rules_e2e_check.py --check
      - name: Verify displayed qualification
        working-directory: frontend
        run: |
          npm ci
          npm test -- --maxWorkers=2 --minWorkers=1 src/task027f-candidates.test.tsx src/task088-strategy-summary.test.tsx
