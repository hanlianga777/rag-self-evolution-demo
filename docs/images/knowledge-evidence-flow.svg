<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 408" role="img" aria-labelledby="knowledge-evidence-flow-title knowledge-evidence-flow-desc" style="font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif"><title id="knowledge-evidence-flow-title">知识处理与证据链路</title><desc id="knowledge-evidence-flow-desc">四份 PDF 经 MinerU 解析、Parent-Child 分块、向量与 BM25 检索、融合和重排后展开 Parent，回答通过文档章节页码引用原页。</desc><defs><marker id="knowledge-evidence-flow-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6A7990"/></marker><marker id="knowledge-evidence-flow-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0E7A5A"/></marker><marker id="knowledge-evidence-flow-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6A7990"/></marker></defs><rect width="1200" height="408" fill="#F3F5F8"/><text x="40" y="44" font-size="24" fill="#142033" font-weight="600" text-anchor="start">知识处理与证据链路</text><text x="40" y="76" font-size="16" fill="#6A7990" font-weight="400" text-anchor="start">Child 用于精准检索，Parent 提供回答上下文，来源元数据跟随证据传递</text><text x="40" y="112" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">离线知识处理</text><text x="484" y="112" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">在线检索与回答</text><path d="M140 204 H164" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#knowledge-evidence-flow-arrow)"/><path d="M284 204 H308" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#knowledge-evidence-flow-arrow)"/><path d="M460 204 H484" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#knowledge-evidence-flow-arrow)"/><path d="M620 204 H644" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#knowledge-evidence-flow-arrow)"/><path d="M756 204 H780" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#knowledge-evidence-flow-arrow)"/><path d="M876 204 H900" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#knowledge-evidence-flow-arrow)"/><path d="M1012 204 H1036" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#knowledge-evidence-flow-arrow)"/><rect x="40" y="136" width="100" height="136" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="52" y="168" font-size="16" fill="#142033" font-weight="600" text-anchor="start">PDF 说明书</text><text x="52" y="224" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">4 份</text><rect x="164" y="136" width="120" height="136" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="176" y="168" font-size="16" fill="#142033" font-weight="600" text-anchor="start">MinerU 解析</text><text x="176" y="224" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">保留页码</text><rect x="308" y="136" width="152" height="136" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="320" y="168" font-size="16" fill="#142033" font-weight="600" text-anchor="start">Parent-Child</text><text x="320" y="192" font-size="16" fill="#142033" font-weight="600" text-anchor="start">分块</text><text x="320" y="224" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">Child 用于检索</text><text x="320" y="244" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">Parent 用于回答</text><rect x="484" y="136" width="136" height="136" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="496" y="168" font-size="16" fill="#142033" font-weight="600" text-anchor="start">Embedding</text><text x="496" y="192" font-size="12" fill="#142033" font-weight="600" text-anchor="start">Retrieval + BM25</text><text x="496" y="224" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">向量 + 关键词</text><rect x="644" y="136" width="112" height="136" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="656" y="168" font-size="16" fill="#142033" font-weight="600" text-anchor="start">Hybrid 融合</text><text x="656" y="224" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">Candidate K 条</text><rect x="780" y="136" width="96" height="136" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="792" y="168" font-size="16" fill="#142033" font-weight="600" text-anchor="start">Rerank</text><text x="792" y="224" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">重排候选</text><rect x="900" y="136" width="112" height="136" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="912" y="168" font-size="16" fill="#142033" font-weight="600" text-anchor="start">Parent 展开</text><text x="912" y="224" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">Top-K 段</text><text x="912" y="244" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">进入回答</text><rect x="1036" y="136" width="124" height="136" rx="8" fill="#E5F3EC" stroke="#0E7A5A" stroke-width="1.2"/><text x="1048" y="168" font-size="16" fill="#0E7A5A" font-weight="600" text-anchor="start">回答引用</text><text x="1048" y="224" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">文档 · 章节</text><text x="1048" y="244" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">页码</text><text x="40" y="316" font-size="16" fill="#142033" font-weight="600" text-anchor="start">回答引用可沿 文档 → 章节 → 页码 追溯到说明书原页</text><path d="M40 344 H1160" stroke="#E3E8EF"/><text x="40" y="368" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">实线 = 知识 / 证据流转　　浅绿 = 回答引用　　来源元数据贯穿 Child → Parent → PDF 原页</text></svg>
