<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="architecture-business-title architecture-business-desc" style="font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif"><title id="architecture-business-title">业务架构</title><desc id="architecture-business-desc">知识与 Golden 经人工冻结后形成 Baseline，Agent 在同尺 Sandbox 中循环验证，人工确认精修和发布，问答反馈再次回流。</desc><defs><marker id="architecture-business-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6A7990"/></marker><marker id="architecture-business-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0E7A5A"/></marker><marker id="architecture-business-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6A7990"/></marker></defs><rect width="1200" height="560" fill="#F3F5F8"/><text x="40" y="44" font-size="24" fill="#142033" font-weight="600" text-anchor="start">从可信评测到受控优化，再到人工发布</text><text x="40" y="72" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">同一套 Golden 贯穿 Baseline 与 Sandbox；三道人工作用各不相同</text><path d="M232 144 H264" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#architecture-business-arrow)"/><path d="M528 144 H560" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#architecture-business-arrow)"/><path d="M752 144 H784" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#architecture-business-arrow)"/><path d="M1136 192 V224 Q1136 232 1128 232 H72 Q64 232 64 240 V272" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#architecture-business-arrow)"/><path d="M472 352 H504" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#architecture-business-arrow)"/><path d="M800 352 H832" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#architecture-business-arrow)"/><path d="M976 352 H1008" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#architecture-business-arrow)"/><path d="M1080 432 V464 Q1080 472 1072 472 H96 Q88 472 88 464 V432" fill="none" stroke="#6A7990" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#architecture-business-arrow)"/><rect x="448" y="200" width="304" height="24" fill="#F3F5F8"/><text x="600.0" y="216" font-size="12" fill="#6A7990" font-weight="400" text-anchor="middle">基于 Bad Case 进入优化</text><rect x="400" y="440" width="432" height="24" fill="#F3F5F8"/><text x="616.0" y="456" font-size="12" fill="#6A7990" font-weight="400" text-anchor="middle">人工标记为 Bad Case，触发新一轮优化</text><rect x="40" y="96" width="192" height="96" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="56" y="124" font-size="20" fill="#142033" font-weight="600" text-anchor="start">知识库</text><text x="56" y="152" font-size="16" fill="#142033" font-weight="400" text-anchor="start">4 份设备说明书</text><text x="56" y="176" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">Parent-Child · 可溯源</text><rect x="264" y="96" width="264" height="96" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="280" y="124" font-size="20" fill="#142033" font-weight="600" text-anchor="start">Golden Dataset</text><text x="280" y="152" font-size="16" fill="#142033" font-weight="400" text-anchor="start">覆盖规划 → 出题</text><text x="280" y="176" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">硬校验 · Probe · QC</text><rect x="560" y="96" width="192" height="96" rx="8" fill="#FFFFFF" stroke="#111A2B" stroke-width="1.2"/><g transform="translate(576 112)" fill="none" stroke="#111A2B" stroke-width="1.2"><rect x="0" y="8" width="16" height="12" rx="4"/><path d="M4 8 V4 A4 4 0 0 1 12 4 V8"/></g><text x="600" y="128" font-size="16" fill="#142033" font-weight="600" text-anchor="start">人工关口 ①</text><text x="576" y="164" font-size="16" fill="#142033" font-weight="400" text-anchor="start">题卷冻结</text><rect x="784" y="96" width="376" height="96" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="800" y="124" font-size="20" fill="#142033" font-weight="600" text-anchor="start">Baseline 评测</text><text x="800" y="152" font-size="16" fill="#142033" font-weight="400" text-anchor="start">Judge 逐题判分 · 11 项 Hard Gate</text><text x="800" y="176" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">Bad Case 诊断</text><rect x="40" y="272" width="432" height="160" rx="8" fill="#E5F3EC" stroke="#0E7A5A" stroke-width="1.2"/><text x="56" y="300" font-size="20" fill="#0E7A5A" font-weight="600" text-anchor="start">Agent 优化循环</text><text x="456" y="300" font-size="12" fill="#0E7A5A" font-weight="400" text-anchor="end">≤ 12 次评测（含 D）</text><path d="M164 340 H188" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#architecture-business-arrow)"/><path d="M288 340 H312" fill="none" stroke="#6A7990" stroke-width="1.2"  marker-end="url(#architecture-business-arrow)"/><path d="M432 384 V408 Q432 416 424 416 H88 Q80 416 80 408 V384" fill="none" stroke="#6A7990" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#architecture-business-arrow)"/><text x="56" y="332" font-size="16" fill="#142033" font-weight="600" text-anchor="start">Candidate</text><text x="56" y="352" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">A / B / C</text><text x="56" y="372" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">三个不同方向</text><text x="192" y="336" font-size="16" fill="#142033" font-weight="600" text-anchor="start">Sandbox</text><text x="192" y="360" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">同一套 Golden</text><text x="316" y="336" font-size="16" fill="#142033" font-weight="600" text-anchor="start">Regression Check</text><text x="316" y="356" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">新增关键失败 0</text><text x="316" y="376" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">普通失败 ≤ 1</text><rect x="112" y="384" width="292" height="24" fill="#E5F3EC"/><text x="258.0" y="400" font-size="12" fill="#6A7990" font-weight="400" text-anchor="middle">无合格 Candidate：带经验进入下一轮</text><rect x="504" y="272" width="296" height="160" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="520" y="300" font-size="20" fill="#142033" font-weight="600" text-anchor="start">决策与精修</text><text x="520" y="324" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">Winner · 出现合格 Candidate</text><rect x="520" y="332" width="264" height="32" rx="8" fill="#FFFFFF" stroke="#111A2B" stroke-width="1.2"/><g transform="translate(532 336)" fill="none" stroke="#111A2B" stroke-width="1.2"><rect x="0" y="8" width="16" height="12" rx="4"/><path d="M4 8 V4 A4 4 0 0 1 12 4 V8"/></g><text x="556" y="352" font-size="12" fill="#142033" font-weight="600" text-anchor="start">人工关口 ② · 实验报告确认</text><text x="520" y="388" font-size="16" fill="#142033" font-weight="600" text-anchor="start">Candidate D · 在 Winner 上精修</text><text x="520" y="412" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">预测 vs 实际 → 最终推荐</text><rect x="832" y="272" width="144" height="160" rx="8" fill="#FFFFFF" stroke="#111A2B" stroke-width="1.2"/><g transform="translate(848 292)" fill="none" stroke="#111A2B" stroke-width="1.2"><rect x="0" y="8" width="16" height="12" rx="4"/><path d="M4 8 V4 A4 4 0 0 1 12 4 V8"/></g><text x="848" y="336" font-size="16" fill="#142033" font-weight="600" text-anchor="start">人工关口 ③</text><text x="848" y="364" font-size="16" fill="#142033" font-weight="400" text-anchor="start">发布授权</text><text x="848" y="392" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">可回滚</text><rect x="1008" y="272" width="152" height="160" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><text x="1024" y="304" font-size="20" fill="#142033" font-weight="600" text-anchor="start">问答验证</text><text x="1024" y="336" font-size="16" fill="#142033" font-weight="400" text-anchor="start">实时问答</text><text x="1024" y="364" font-size="16" fill="#142033" font-weight="400" text-anchor="start">Before/After</text><text x="1024" y="392" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">线上反馈</text><path d="M40 496 H1160" stroke="#E3E8EF"/><text x="40" y="520" font-size="12" fill="#6A7990" font-weight="400" text-anchor="start">实线 = 主流程　　虚线 = 经验 / 反馈回流　　锁 + 深藏青描边 = 人工关口　　浅绿 = Agent 优化焦点</text></svg>
