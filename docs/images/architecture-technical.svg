<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 668" role="img" aria-labelledby="architecture-technical-title architecture-technical-desc" style="font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif"><title id="architecture-technical-title">技术架构</title><desc id="architecture-technical-desc">React 展示、FastAPI 治理、十二项白名单参数的 RAG Pipeline、离线知识处理与 SQLite 和模型 Provider 构成五层架构。</desc><defs><marker id="architecture-technical-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6E6E73"/></marker><marker id="architecture-technical-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0071E3"/></marker><marker id="architecture-technical-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6E6E73"/></marker></defs><rect width="1200" height="668" fill="#F5F5F7"/><text x="40" y="44" font-size="24" fill="#1D1D1F" font-weight="600" text-anchor="start">治理服务调度，RAG Pipeline 受控演进</text><rect x="40" y="72" width="1120" height="52" rx="8" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/><rect x="40" y="136" width="1120" height="96" rx="8" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/><rect x="40" y="264" width="1120" height="140" rx="8" fill="#EAF3FE" stroke="#0071E3" stroke-width="1.2"/><rect x="40" y="436" width="1120" height="64" rx="8" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/><rect x="40" y="512" width="1120" height="76" rx="8" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/><path d="M1144 232 V264" fill="none" stroke="#6E6E73" stroke-width="1.2"  marker-end="url(#architecture-technical-arrow)"/><rect x="1032" y="236" width="96" height="24" fill="#F5F5F7"/><text x="1080.0" y="252" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="middle">调度 Pipeline</text><path d="M1144 436 V404" fill="none" stroke="#6E6E73" stroke-width="1.2"  marker-end="url(#architecture-technical-arrow)"/><rect x="1008" y="408" width="112" height="24" fill="#F5F5F7"/><text x="1064.0" y="424" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="middle">产出检索索引</text><text x="56" y="104" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">01  展示层</text><text x="224" y="104" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">React Demo · 8 个页面</text><text x="456" y="104" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">概览 · 知识库 · Pipeline 配置 · Golden Dataset · Baseline · Agent 工作台 · 发布 · 问答验证</text><text x="56" y="164" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">02  治理服务层</text><text x="56" y="188" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">FastAPI</text><text x="248" y="164" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">评测治理</text><text x="248" y="192" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">Golden 生命周期 · Judge</text><text x="248" y="212" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">Hard Gate · Regression</text><text x="480" y="164" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">Agent 优化</text><text x="480" y="192" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">Candidate 生成 · Sandbox 执行</text><text x="480" y="212" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">Candidate D 精修</text><text x="720" y="164" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">版本发布</text><text x="720" y="192" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">推荐 · 发布快照</text><text x="720" y="212" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">回滚</text><text x="56" y="292" font-size="20" fill="#0071E3" font-weight="600" text-anchor="start">03  RAG Pipeline</text><text x="280" y="292" font-size="12" fill="#0071E3" font-weight="400" text-anchor="start">被优化对象</text><path d="M284 324 H316" fill="none" stroke="#6E6E73" stroke-width="1.2"  marker-end="url(#architecture-technical-arrow)"/><text x="56" y="324" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">Query 理解</text><text x="56" y="352" font-size="12" fill="#0071E3" font-weight="400" text-anchor="start">● Query Rewrite · Multi-Query</text><text x="56" y="376" font-size="12" fill="#0071E3" font-weight="400" text-anchor="start">● HyDE</text><path d="M564 324 H596" fill="none" stroke="#6E6E73" stroke-width="1.2"  marker-end="url(#architecture-technical-arrow)"/><text x="336" y="324" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">Hybrid Search</text><text x="336" y="352" font-size="12" fill="#0071E3" font-weight="400" text-anchor="start">● Candidate K · Hybrid Search</text><text x="336" y="376" font-size="12" fill="#0071E3" font-weight="400" text-anchor="start">● Embedding Retrieval 权重</text><path d="M844 324 H876" fill="none" stroke="#6E6E73" stroke-width="1.2"  marker-end="url(#architecture-technical-arrow)"/><text x="616" y="324" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">Rerank → Parent 展开</text><text x="616" y="352" font-size="12" fill="#0071E3" font-weight="400" text-anchor="start">● Rerank · Top-K · MinScore</text><text x="616" y="376" font-size="12" fill="#0071E3" font-weight="400" text-anchor="start">● 上下文容量</text><text x="896" y="324" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">回答生成</text><text x="896" y="352" font-size="12" fill="#0071E3" font-weight="400" text-anchor="start">● Thinking 档位 · Prompt 策略</text><text x="336" y="392" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">Embedding Retrieval + BM25</text><text x="616" y="392" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">qwen3-rerank</text><text x="896" y="392" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">DeepSeek</text><text x="56" y="464" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">04  知识处理层</text><text x="56" y="488" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">离线</text><text x="248" y="460" font-size="16" fill="#1D1D1F" font-weight="400" text-anchor="start">PDF → MinerU 解析 → Parent-Child 分块（1400 / 400 / 重叠 80）</text><text x="248" y="484" font-size="16" fill="#1D1D1F" font-weight="400" text-anchor="start">→ text-embedding-v4（1024 维）→ FAISS 索引 + BM25</text><text x="56" y="540" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">05  数据与模型层</text><text x="248" y="540" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">SQLite</text><text x="248" y="568" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">Run · Golden · 版本 · 审计</text><text x="584" y="540" font-size="16" fill="#1D1D1F" font-weight="600" text-anchor="start">模型 Provider</text><text x="584" y="568" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">DeepSeek：回答生成 · Judge · Agent　　Qwen：Embedding · Rerank</text><path d="M40 604 H1160" stroke="#E5E5EA"/><text x="40" y="628" font-size="12" fill="#6E6E73" font-weight="400" text-anchor="start">● = Agent 可调参数（白名单）　　各服务按需读写 SQLite、调用 Provider；上下分层表示职责，箭头仅标关键调度 / 索引关系</text></svg>
